name: ECO-BRAIN Verification

on:
  push:
    branches: [main, "eco-cel/**", "pilot/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest jsonschema
      - run: PYTHONPATH=. pytest -q
      - name: Validate CAP-002 contract schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in Path("contracts/CAP-002").glob("*.schema.json"):
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
              print(f"VALID_SCHEMA {path}")
          PY
